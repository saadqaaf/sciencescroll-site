<style>
/* Self-hosted fonts (SIL Open Font License) — no dependency on Google Fonts */
@font-face{font-family:"Vazirmatn";font-style:normal;font-weight:100 900;font-display:swap;src:url("fonts/Vazirmatn-wght.woff2") format("woff2")}
@font-face{font-family:"Inter";font-style:normal;font-weight:400;font-display:swap;src:url("fonts/inter-400.woff2") format("woff2")}
@font-face{font-family:"Inter";font-style:normal;font-weight:500;font-display:swap;src:url("fonts/inter-500.woff2") format("woff2")}
@font-face{font-family:"Inter";font-style:normal;font-weight:600;font-display:swap;src:url("fonts/inter-600.woff2") format("woff2")}
@font-face{font-family:"Inter";font-style:normal;font-weight:700;font-display:swap;src:url("fonts/inter-700.woff2") format("woff2")}
@font-face{font-family:"Inter";font-style:normal;font-weight:800;font-display:swap;src:url("fonts/inter-800.woff2") format("woff2")}
:root{
  --bg:#f7f7f4; --surface:#ffffff; --surface-2:#f1f1ec; --ink:#14161a; --ink-2:#2b2f36; --muted:#646b77; --line:#e5e5df;
  --brand:#0a46a0; --brand-ink:#ffffff; --brand-soft:#e8effa;
  --radar:#0b8a5e; --radar-soft:#e3f5ec;
  --amber:#a86310; --amber-soft:#fcf1de;
  --oa:#0b6f86; --oa-soft:#e2f3f6;
  --violet:#7a3fb0; --violet-soft:#f3eafb;
  --shadow:0 1px 2px rgba(20,22,26,.04),0 8px 24px -12px rgba(20,22,26,.12);
  --shadow-lg:0 2px 4px rgba(20,22,26,.04),0 24px 48px -20px rgba(20,22,26,.22);
  --radius:18px; --radius-sm:12px;
  --maxw:1180px;
  --font-en:"Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-fa:"Vazirmatn","Inter",Tahoma,ui-sans-serif,system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0c0e12; --surface:#14171d; --surface-2:#1b1f27; --ink:#eceef2; --ink-2:#d3d7de; --muted:#98a1b0; --line:#262b35;
    --brand:#7fa8ff; --brand-ink:#0c0e12; --brand-soft:#15244a;
    --radar:#3fd49a; --radar-soft:#0f2a20;
    --amber:#f2bd62; --amber-soft:#2a2112;
    --oa:#5cc6dc; --oa-soft:#0e2830;
    --violet:#c79bf2; --violet-soft:#261a33;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px -12px rgba(0,0,0,.6);
    --shadow-lg:0 2px 4px rgba(0,0,0,.3),0 24px 48px -20px rgba(0,0,0,.7);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0c0e12; --surface:#14171d; --surface-2:#1b1f27; --ink:#eceef2; --ink-2:#d3d7de; --muted:#98a1b0; --line:#262b35;
  --brand:#7fa8ff; --brand-ink:#0c0e12; --brand-soft:#15244a;
  --radar:#3fd49a; --radar-soft:#0f2a20;
  --amber:#f2bd62; --amber-soft:#2a2112;
  --oa:#5cc6dc; --oa-soft:#0e2830;
  --violet:#c79bf2; --violet-soft:#261a33;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px -12px rgba(0,0,0,.6);
  --shadow-lg:0 2px 4px rgba(0,0,0,.3),0 24px 48px -20px rgba(0,0,0,.7);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{animation:none!important;transition:none!important}}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-fa);font-size:16px;line-height:1.65;-webkit-font-smoothing:antialiased;overflow-x:hidden}
html[lang="en"] body{font-family:var(--font-en)}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer}
img,svg{display:block}
.wrap{max-width:var(--maxw);margin-inline:auto;padding-inline:20px}
.ltr{direction:ltr;unicode-bidi:isolate;font-family:var(--font-en)}
.rtl{direction:rtl;unicode-bidi:isolate;font-family:var(--font-fa)}
:focus-visible{outline:2px solid var(--brand);outline-offset:3px;border-radius:8px}
[hidden]{display:none!important}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- Header ---------- */
.header{position:sticky;top:0;z-index:50;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px);border-bottom:1px solid transparent;transition:border-color .2s}
.header.scrolled{border-bottom-color:var(--line)}
.header .wrap{display:flex;align-items:center;gap:16px;height:64px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:-.01em;font-family:var(--font-en);direction:ltr}
.brand-logo{width:34px;height:34px;border-radius:50%;flex:none}
.brand small{display:block;font-weight:500;color:var(--muted);font-size:11px;letter-spacing:.02em;line-height:1}
.nav{display:flex;gap:4px;margin-inline-start:auto}
.nav a{padding:8px 12px;border-radius:10px;color:var(--muted);font-size:14px;font-weight:500}
.nav a:hover{color:var(--ink);background:var(--surface-2)}
.tools{display:flex;align-items:center;gap:8px}
.seg{display:flex;background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:3px}
.seg button{border:0;background:transparent;padding:5px 11px;border-radius:999px;font-size:13px;font-weight:600;color:var(--muted);line-height:1.2}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.icon-btn{width:36px;height:36px;border-radius:999px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--ink-2)}
.icon-btn svg{width:17px;height:17px}
.icon-btn:hover{background:var(--surface-2)}

/* ---------- Buttons ---------- */
.btn{display:inline-flex;align-items:center;gap:9px;padding:12px 18px;border-radius:14px;font-weight:600;font-size:15px;border:1px solid transparent;transition:transform .15s,box-shadow .15s,background .15s;white-space:nowrap}
.btn svg{width:18px;height:18px;flex:none}
.btn:hover{transform:translateY(-1px)}
.btn-primary{background:var(--brand);color:var(--brand-ink);box-shadow:0 6px 18px -8px color-mix(in srgb,var(--brand) 70%,transparent)}
.btn-radar{background:var(--radar);color:var(--brand-ink);box-shadow:0 6px 18px -8px color-mix(in srgb,var(--radar) 70%,transparent)}
.btn-ghost{background:var(--surface);border-color:var(--line);color:var(--ink)}
.btn-ghost:hover{background:var(--surface-2)}
.btn-sm{padding:8px 13px;font-size:13.5px;border-radius:11px}

/* ---------- Hero ---------- */
.hero{padding:56px 0 40px}
.hero-grid{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr);gap:56px;align-items:center}
.eyebrow{display:inline-flex;align-items:center;gap:8px;padding:6px 12px 6px 8px;border:1px solid var(--line);background:var(--surface);border-radius:999px;font-size:13px;color:var(--muted);font-weight:500}
.live-dot{width:8px;height:8px;border-radius:50%;background:var(--radar);box-shadow:0 0 0 0 color-mix(in srgb,var(--radar) 60%,transparent);animation:pulse 2s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 8px transparent}100%{box-shadow:0 0 0 0 transparent}}
.hero h1{font-size:clamp(34px,5.2vw,58px);line-height:1.12;letter-spacing:-.025em;margin:18px 0 16px;font-weight:800}
html[lang="fa"] .hero h1{letter-spacing:0;line-height:1.35}
.hero h1 .accent{background:linear-gradient(100deg,var(--brand),var(--radar));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p.lead{font-size:clamp(16px,1.6vw,19px);color:var(--muted);max-width:560px;margin:0 0 28px}
.cta{display:flex;flex-wrap:wrap;gap:10px}
.stats{display:grid;grid-template-columns:repeat(4,auto);justify-content:start;gap:28px;margin-top:36px;padding-top:24px;border-top:1px solid var(--line)}
.stat b{display:block;font-size:22px;font-weight:800;letter-spacing:-.01em}
.stat span{font-size:13px;color:var(--muted)}

/* Hero preview card */
.preview{position:relative;padding:18px}
.preview::before{content:"";position:absolute;inset:0;border-radius:28px;background:radial-gradient(60% 60% at 30% 20%,color-mix(in srgb,var(--brand) 16%,transparent),transparent 70%),radial-gradient(50% 50% at 80% 90%,color-mix(in srgb,var(--radar) 16%,transparent),transparent 70%);z-index:0}
.preview .post{position:relative;z-index:1;box-shadow:var(--shadow-lg)}
.legend{position:relative;z-index:1;display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:16px}
.legend span{font-size:12.5px;font-weight:600;padding:6px 11px;border-radius:999px;background:var(--surface);border:1px solid var(--line);color:var(--ink-2);white-space:nowrap}
.legend i{font-style:normal;margin-inline-end:5px}

/* ---------- Marquee ---------- */
.marquee{border-block:1px solid var(--line);background:var(--surface);overflow:hidden;direction:ltr}
.marquee-track{display:flex;gap:40px;width:max-content;padding:16px 0;animation:scroll 60s linear infinite;font-family:var(--font-en);font-weight:600;color:var(--muted);font-size:15px;white-space:nowrap}
.marquee-track span{display:inline-flex;align-items:center;gap:40px}
.marquee-track span::after{content:"";width:4px;height:4px;border-radius:50%;background:var(--line)}
.marquee:hover .marquee-track{animation-play-state:paused}
@keyframes scroll{to{transform:translateX(-50%)}}

/* ---------- Sections ---------- */
section{scroll-margin-top:80px}
.section{padding:72px 0}
.section-head{display:flex;align-items:end;justify-content:space-between;gap:20px;margin-bottom:28px;flex-wrap:wrap}
.kicker{font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--brand)}
html[lang="fa"] .kicker{letter-spacing:0}
.section h2{font-size:clamp(26px,3.2vw,36px);letter-spacing:-.02em;line-height:1.2;margin:6px 0 0;font-weight:800}
html[lang="fa"] .section h2{letter-spacing:0;line-height:1.45}
.section-sub{color:var(--muted);max-width:560px;margin:10px 0 0}

/* ---------- Channel cards ---------- */
.channels{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px}
.channel{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:28px;box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column}
.channel::after{content:"";position:absolute;inset-inline-end:-80px;top:-80px;width:220px;height:220px;border-radius:50%;background:var(--glow);opacity:.14;filter:blur(8px)}
.channel.main{--glow:var(--brand);--c:var(--brand);--c-soft:var(--brand-soft)}
.channel.radar{--glow:var(--radar);--c:var(--radar);--c-soft:var(--radar-soft)}
.channel-top{display:flex;align-items:center;gap:14px}
.avatar{width:56px;height:56px;border-radius:50%;flex:none;box-shadow:0 4px 14px -6px rgba(0,0,0,.35)}
.channel h3{margin:0;font-size:22px;font-family:var(--font-en);letter-spacing:-.01em;direction:ltr;text-align:start}
.channel .handle{font-size:13.5px;color:var(--muted);font-family:var(--font-en);direction:ltr;display:inline-block}
.channel p.desc{color:var(--ink-2);margin:18px 0 16px}
.features{list-style:none;padding:0;margin:0 0 24px;display:grid;gap:10px}
.features li{display:flex;gap:10px;align-items:flex-start;font-size:14.5px;color:var(--ink-2)}
.features li svg{width:18px;height:18px;flex:none;margin-top:3px;color:var(--c)}
.channel .actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:auto}
.tags-row{display:flex;flex-wrap:wrap;gap:6px;margin:-4px 0 20px}
.tag{font-family:var(--font-en);font-size:12px;font-weight:600;padding:4px 9px;border-radius:999px;background:var(--c-soft);color:var(--c);direction:ltr}

/* ---------- How it works ---------- */
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:8px}
.step{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:22px}
.step .num{width:32px;height:32px;border-radius:10px;background:var(--surface-2);display:grid;place-items:center;font-weight:800;font-size:14px;margin-bottom:14px;color:var(--brand);font-family:var(--font-en)}
.step h4{margin:0 0 6px;font-size:16.5px}
.step p{margin:0;color:var(--muted);font-size:14.5px}

/* ---------- Feed ---------- */
.feed-layout{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:28px;align-items:start}
.controls{position:sticky;top:64px;z-index:10;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);padding:12px 0;margin-bottom:6px;display:grid;gap:10px}
.tabs{display:flex;gap:6px;background:var(--surface);border:1px solid var(--line);padding:4px;border-radius:14px;width:fit-content}
.tabs button{border:0;background:transparent;padding:8px 14px;border-radius:10px;font-weight:600;font-size:14px;color:var(--muted);display:inline-flex;align-items:center;gap:7px}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--bg)}
.tabs .count{font-size:11.5px;padding:1px 7px;border-radius:999px;background:var(--surface-2);color:var(--muted);font-family:var(--font-en)}
.tabs button[aria-selected="true"] .count{background:color-mix(in srgb,var(--bg) 20%,transparent);color:var(--bg)}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.search{flex:1 1 220px;display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:0 12px;min-width:0}
.search svg{width:16px;height:16px;color:var(--muted);flex:none}
.search input{border:0;background:transparent;outline:0;padding:10px 0;width:100%;font:inherit;font-size:14.5px;color:var(--ink);min-width:0}
.chip{border:1px solid var(--line);background:var(--surface);padding:8px 12px;border-radius:12px;font-size:13.5px;font-weight:600;color:var(--muted);display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{border-color:var(--ink);color:var(--ink);background:var(--surface-2)}
.active-kw{display:none;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.active-kw.on{display:flex}
.active-kw button{border:0;background:var(--brand-soft);color:var(--brand);padding:4px 10px;border-radius:999px;font-weight:600;font-size:12.5px;font-family:var(--font-en)}

.feed{display:grid;grid-template-columns:minmax(0,1fr);gap:14px}
.post{min-width:0}
.post{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;transition:border-color .15s,box-shadow .15s}
.post:hover{border-color:color-mix(in srgb,var(--ink) 18%,var(--line));box-shadow:var(--shadow)}
.post-head{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted);min-width:0}
.post-av{width:36px;height:36px;border-radius:50%;flex:none}
.post-meta{display:flex;flex-direction:column;min-width:0;line-height:1.35}
.post-meta b{color:var(--ink);font-size:13.5px;font-family:var(--font-en);direction:ltr;text-align:start;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.post-meta span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.post-time{margin-inline-start:auto;white-space:nowrap;font-size:12.5px}
.post-title{display:block;margin:12px 0 0;font-size:17px;line-height:1.45;font-weight:700;letter-spacing:-.005em;color:var(--ink);text-align:left}
.post-title:hover{color:var(--brand)}
.post-fa{margin:10px 0 0;font-size:15px;line-height:1.85;color:var(--ink-2);text-align:right}
.badges{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:4px 9px;border-radius:8px;font-family:var(--font-en);direction:ltr}
.badge svg{width:13px;height:13px}
.b-research{background:var(--surface-2);color:var(--ink-2)}
.b-review{background:var(--amber-soft);color:var(--amber)}
.b-perspective{background:var(--violet-soft);color:var(--violet)}
.b-oa{background:var(--oa-soft);color:var(--oa)}
.b-radar{background:var(--radar-soft);color:var(--radar)}
a.badge:hover{filter:brightness(.95)}
.kws{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px;direction:ltr}
.kw{border:1px solid var(--line);background:transparent;padding:3px 9px;border-radius:999px;font-size:12px;color:var(--muted);font-family:var(--font-en);line-height:1.5}
.kw:hover{color:var(--brand);border-color:color-mix(in srgb,var(--brand) 40%,var(--line))}
details.digest{margin-top:12px;background:var(--radar-soft);border-radius:12px;padding:10px 14px}
details.digest summary{cursor:pointer;font-size:13px;font-weight:700;color:var(--radar);list-style:none;display:flex;align-items:center;gap:6px}
details.digest summary::-webkit-details-marker{display:none}
details.digest summary::after{content:"+";margin-inline-start:auto;font-size:16px}
details.digest[open] summary::after{content:"−"}
details.digest p{margin:8px 0 2px;font-size:14px;color:var(--ink-2);font-family:var(--font-en);direction:ltr;text-align:left;line-height:1.6}
.post-foot{display:flex;align-items:center;gap:14px;margin-top:14px;padding-top:12px;border-top:1px dashed var(--line);font-size:12.5px;color:var(--muted)}
.post-foot a{display:inline-flex;align-items:center;gap:5px;font-family:var(--font-en);direction:ltr}
.post-foot a:hover{color:var(--brand)}
.post-foot svg{width:14px;height:14px}
.post-foot .doi{margin-inline-start:auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:50%}
.empty{text-align:center;color:var(--muted);padding:48px 16px;border:1px dashed var(--line);border-radius:var(--radius)}
.more{display:flex;justify-content:center;margin-top:18px}
.skeleton{height:170px;border-radius:var(--radius);background:linear-gradient(90deg,var(--surface) 0%,var(--surface-2) 50%,var(--surface) 100%);background-size:200% 100%;animation:shimmer 1.4s infinite;border:1px solid var(--line)}
@keyframes shimmer{to{background-position:-200% 0}}

/* Sidebar */
.side{position:sticky;top:84px;display:grid;grid-template-columns:minmax(0,1fr);gap:14px;min-width:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px}
.panel h4{margin:0 0 14px;font-size:14px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.panel h4 small{font-weight:500;color:var(--muted);font-size:12px}
.glance{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.glance div{background:var(--surface-2);border-radius:12px;padding:10px 12px}
.glance b{display:block;font-size:22px;font-weight:800;line-height:1.2}
.glance span{font-size:12px;color:var(--muted)}
.topkws{display:flex;flex-wrap:wrap;gap:6px}
.topkws button{border:1px solid var(--line);background:var(--surface);padding:5px 10px;border-radius:999px;font-size:12.5px;font-family:var(--font-en);color:var(--ink-2);direction:ltr}
.topkws button:hover{border-color:var(--brand);color:var(--brand)}
.topkws button em{font-style:normal;color:var(--muted);margin-left:4px}
.toplist{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.toplist li{display:flex;justify-content:space-between;gap:10px;font-size:13.5px}
.toplist li span{font-family:var(--font-en);direction:ltr;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.toplist li b{font-family:var(--font-en);color:var(--muted);font-weight:600}
.rss-links{display:grid;gap:8px}
.rss-links a{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:var(--surface-2);font-size:13.5px;font-weight:600}
.rss-links a svg{width:16px;height:16px;color:var(--amber);flex:none}
.rss-links a span{margin-inline-start:auto;font-size:11.5px;color:var(--muted);font-family:var(--font-en);font-weight:500}
.updated{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:8px}
.demo-pill{display:none;font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--amber-soft);color:var(--amber)}
.demo .demo-pill{display:inline-block}

/* ---------- Join band ---------- */
.join{margin:0 0 72px;border-radius:28px;padding:40px;background:linear-gradient(120deg,var(--brand),color-mix(in srgb,var(--brand) 55%,var(--radar)));color:#fff;display:grid;grid-template-columns:1.2fr 1fr;gap:24px;align-items:center;position:relative;overflow:hidden}
:root[data-theme="dark"] .join{color:#0c0e12}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .join{color:#0c0e12}}
.join h2{margin:0 0 8px;font-size:clamp(24px,3vw,32px);line-height:1.3}
.join p{margin:0;opacity:.85}
.join .actions{display:flex;flex-wrap:wrap;gap:10px;justify-content:flex-end}
.btn-white{background:#fff;color:#14161a}
.btn-outline-white{border-color:rgba(255,255,255,.5);color:inherit;background:rgba(255,255,255,.08)}
:root[data-theme="dark"] .btn-outline-white{border-color:rgba(12,14,18,.35);background:rgba(12,14,18,.06)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn-outline-white{border-color:rgba(12,14,18,.35);background:rgba(12,14,18,.06)}}

/* ---------- Footer ---------- */
footer{border-top:1px solid var(--line);padding:32px 0 40px;color:var(--muted);font-size:13.5px}
footer .wrap{display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between}
footer nav{display:flex;flex-wrap:wrap;gap:18px}
footer nav a:hover{color:var(--ink)}

/* ---------- Responsive ---------- */
@media (max-width:1020px){
  .hero-grid{grid-template-columns:minmax(0,1fr);gap:40px}
  .preview{max-width:560px}
  .feed-layout{grid-template-columns:minmax(0,1fr)}
  .side{position:static;grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .side .panel.rss{grid-column:1/-1}
  .join{grid-template-columns:1fr}
  .join .actions{justify-content:flex-start}
}
@media (max-width:760px){
  .nav{display:none}
  .tools{margin-inline-start:auto}
  .hero{padding:36px 0 28px}
  .stats{grid-template-columns:repeat(2,1fr);gap:18px}
  .channels,.steps{grid-template-columns:minmax(0,1fr)}
  .side{grid-template-columns:minmax(0,1fr)}
  .section{padding:52px 0}
  .preview{padding:0}
  .preview::before{inset:-12px -12px 40px}
  .channel{padding:22px}
  .join{padding:28px 22px;border-radius:22px;margin-bottom:52px}
  .post{padding:16px}
  .post-title{font-size:16px}
  .tabs{width:100%}
  .tabs button{flex:1 1 0;min-width:0;justify-content:center;padding:8px 6px;font-size:13px}
  .tabs button span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .chip{padding:8px 10px}
  .btn{padding:11px 15px}
  .cta .btn{flex:1 1 auto;justify-content:center}
}
@media (max-width:380px){
  .brand small{display:none}
  .seg button{padding:5px 8px}
}

   APP

const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
const store = { get(k){try{return localStorage.getItem(k)}catch(e){return null}}, set(k,v){try{localStorage.setItem(k,v)}catch(e){}} };
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const state = { lang:"fa", tab:"all", review:false, oa:false, q:"", kw:"", shown:CONFIG.pageSize, data:null };

function t(k){ return (T[state.lang] && T[state.lang][k]) ?? T.en[k] ?? k; }
function num(n){ return Number(n).toLocaleString(state.lang === "fa" ? "fa-IR" : "en-US"); }
function ago(iso){
  const d = (new Date(iso) - Date.now())/1000;
  const rtf = new Intl.RelativeTimeFormat(state.lang === "fa" ? "fa" : "en", {numeric:"auto", style:"short"});
  const a = Math.abs(d);
  if (a < 3600) return rtf.format(Math.round(d/60), "minute");
  if (a < 86400) return rtf.format(Math.round(d/3600), "hour");
  return rtf.format(Math.round(d/86400), "day");
}
function paperLink(p){ return state.data && state.data.demo ? "#feed" : "https://doi.org/" + encodeURI(p.doi); }

/* ---- language ---- */
function applyLang(lang){
  state.lang = lang;
  document.documentElement.lang = lang;
  document.documentElement.dir = lang === "fa" ? "rtl" : "ltr";
  $$("[data-i18n]").forEach(el => el.textContent = t(el.dataset.i18n));
  $$("[data-i18n-html]").forEach(el => el.innerHTML = t(el.dataset.i18nHtml));
  $$("[data-i18n-ph]").forEach(el => el.placeholder = t(el.dataset.i18nPh));
  $$("[data-num]").forEach(el => el.textContent = num(el.dataset.num) + (el.dataset.suffix || ""));
  $$(".seg button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.lang === lang)));
  store.set("ss-lang", lang);
  render();
}

/* ---- theme ---- */
function currentTheme(){
  const forced = document.documentElement.dataset.theme;
  if (forced) return forced;
  return matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
}
function setThemeIcon(){ $("#themeBtn use").setAttribute("href", currentTheme() === "dark" ? "#i-sun" : "#i-moon"); }
$("#themeBtn").addEventListener("click", () => {
  const next = currentTheme() === "dark" ? "light" : "dark";
  document.documentElement.dataset.theme = next; store.set("ss-theme", next); setThemeIcon();
});

/* ---- links ---- */
function applyLinks(){
  $$("[data-link]").forEach(a => a.href = CONFIG.links[a.dataset.link]);
  $$("[data-handle]").forEach(el => { const u = CONFIG.links[el.dataset.handle]; el.textContent = "@" + u.split("/").pop(); });
  $$("[data-rss]").forEach(a => a.href = CONFIG.rss[a.dataset.rss]);
}

/* ---- post card ---- */
const TYPE_BADGE = {
  research:["b-research","#i-flask","type_research"],
  review:["b-review","#i-star","type_review"],
  perspective:["b-perspective","#i-bulb","type_perspective"]
};
function postHTML(p, opts = {}){
  const radar = p.is_battery && (state.tab === "radar" || opts.forceRadar);
  const [cls, icon, key] = TYPE_BADGE[p.article_type] || TYPE_BADGE.research;
  const link = paperLink(p);
  const badges = [
    `<span class="badge ${cls}"><svg><use href="${icon}"/></svg>${esc(t(key))}</span>`,
    p.open_access ? `<span class="badge b-oa"><svg><use href="#i-unlock"/></svg>${esc(t("oa"))}</span>` : "",
    p.open_access && p.pdf_url ? `<a class="badge b-oa" href="${esc(p.pdf_url)}" target="_blank" rel="noopener"><svg><use href="#i-pdf"/></svg>PDF</a>` : "",
    p.is_battery && !radar ? `<span class="badge b-radar"><svg><use href="#i-bolt"/></svg>${esc(t("battery"))}</span>` : ""
  ].join("");
  const kws = (p.keywords || []).map(k => `<button class="kw" type="button" data-kw="${esc(k)}">${esc(k)}</button>`).join("");
  const digest = radar && p.digest ? `<details class="digest"><summary>💡 ${esc(t("digest"))}</summary><p>${esc(p.digest)}</p></details>` : "";
  return `<article class="post">
    <div class="post-head">
      <img class="post-av" src="assets/${radar ? "battery-radar" : "science-scroll"}.webp" width="36" height="36" alt="">
      <div class="post-meta"><b>${radar ? "Battery Radar" : "Science Scroll"}</b><span class="ltr">${esc(p.journal)}</span></div>
      <span class="post-time">${esc(ago(p.posted_at))}</span>
    </div>
    <a class="post-title ltr" href="${link}" ${link.startsWith("http") ? 'target="_blank" rel="noopener"' : ""}>${esc(p.title)}</a>
    ${p.fa_summary ? `<p class="post-fa rtl">${esc(p.fa_summary)}</p>` : ""}
    <div class="badges">${badges}</div>
    ${digest}
    ${kws ? `<div class="kws">${kws}</div>` : ""}
    <div class="post-foot">
      <a href="${link}" ${link.startsWith("http") ? 'target="_blank" rel="noopener"' : ""}><svg><use href="#i-ext"/></svg>${esc(t("read"))}</a>
      ${p.open_access && p.pdf_url ? `<a href="${esc(p.pdf_url)}" target="_blank" rel="noopener"><svg><use href="#i-pdf"/></svg>${esc(t("pdf"))}</a>` : ""}
      <span class="doi ltr">${esc(p.doi)}</span>
    </div>
  </article>`;
}

/* ---- filtering & render ---- */
function filtered(){
  const d = state.data; if (!d) return [];
  const q = state.q.trim().toLowerCase();
  return d.papers.filter(p =>
    (state.tab === "all" || p.is_battery) &&
    (!state.review || p.article_type === "review") &&
    (!state.oa || p.open_access) &&
    (!state.kw || (p.keywords || []).some(k => k.toLowerCase() === state.kw.toLowerCase())) &&
    (!q || [p.title, p.journal, p.fa_summary, ...(p.keywords || [])].join(" ").toLowerCase().includes(q))
  );
}
function render(){
  const d = state.data; if (!d) return;
  document.body.classList.toggle("demo", !!d.demo);
  $("#updatedText").textContent = d.updated_at ? `${t("updated")} ${ago(d.updated_at)}` : "";
  $("#cntAll").textContent = num(d.papers.length);
  $("#cntRadar").textContent = num(d.papers.filter(p => p.is_battery).length);

  const list = filtered();
  $("#feedList").innerHTML = list.length ? list.slice(0, state.shown).map(p => postHTML(p)).join("") : `<div class="empty">${esc(t("empty"))}</div>`;
  $("#moreBtn").hidden = list.length <= state.shown;
  $("#activeKw").classList.toggle("on", !!state.kw);
  $("#kwClear").textContent = state.kw ? state.kw + "  ✕" : "";

  // hero preview: newest battery paper with a summary
  const hero = d.papers.find(p => p.is_battery && p.fa_summary) || d.papers[0];
  if (hero) $("#heroPost").innerHTML = postHTML(hero, {forceRadar:false});

  // at a glance (last 24 h) — the bot sends exact stats; otherwise compute from the papers in the feed
  const st = d.stats || computeStats(d.papers);
  $("#gTotal").textContent = num(st.total);
  $("#gBattery").textContent = num(st.battery);
  $("#gReview").textContent = num(st.review);
  $("#gOa").textContent = num(st.oa);
  $("#topKws").innerHTML = (st.keywords || []).map(e => `<button type="button" data-kw="${esc(e.k)}">${esc(e.k)}${e.n > 1 ? `<em>${num(e.n)}</em>` : ""}</button>`).join("");
  $("#topJournals").innerHTML = (st.journals || []).map(([j, n]) => `<li><span>${esc(j)}</span><b>${num(n)}</b></li>`).join("");
}
function computeStats(papers){
  const day = papers.filter(p => Date.now() - new Date(p.posted_at) < 864e5);
  const kc = new Map(), jc = new Map();
  day.forEach(p => {
    (p.keywords || []).forEach(k => { const key = k.toLowerCase(); const e = kc.get(key) || {k, n:0}; e.n++; kc.set(key, e); });
    jc.set(p.journal, (jc.get(p.journal) || 0) + 1);
  });
  return {
    total: day.length, battery: day.filter(p => p.is_battery).length,
    review: day.filter(p => p.article_type === "review").length, oa: day.filter(p => p.open_access).length,
    keywords: [...kc.values()].sort((a, b) => b.n - a.n).slice(0, 12),
    journals: [...jc.entries()].sort((a, b) => b[1] - a[1]).slice(0, 5)
  };
}

  $("#marquee").innerHTML = [...JOURNALS, ...JOURNALS].map(j => `<span>${esc(j)}</span>`).join("");
  applyLinks();
  const saved = store.get("ss-lang");
  const lang = saved || "fa"; // Persian first; visitors can switch to English and the choice is remembered
  applyLang(lang === "en" ? "en" : "fa");

  fetch(CONFIG.feedUrl, {cache:"no-store"})
    .then(r => { if (!r.ok) throw 0; return r.json(); })
    .then(d => { if (!d || !Array.isArray(d.papers) || !d.papers.length) throw 0; state.data = d; })
    .catch(() => { state.data = demoData(); })
    .finally(render);
  setInterval(render, 60000); // keep "x min ago" fresh
})();
</script>
</body>
</html>
